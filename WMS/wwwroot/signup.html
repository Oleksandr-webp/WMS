<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Sign Up</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="d-flex justify-content-center align-items-center vh-100">
        <form class="w-100" style="max-width: 400px;" onsubmit="return false;">

            <h2 class="text-center mb-4">Sign Up</h2>

            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password">
            </div>

            <div class="d-none alert text-center" id="message"></div>

            <div class="mb-3">
                <p class="text-center"><a href="index.html">Log In</a></p>
            </div>

            <button class="btn btn-primary w-100" onclick="createUser();">
                Sing in
            </button>

        </form>
    </div>

    <script src="js/signup.js"></script>
</body>
</html>
